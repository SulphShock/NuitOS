# Application bindings
# NOTE: this file is NOT sourced by hyprland.conf — bindings.lua (Lua plugin)
# is the live keybind set. This file is a fallback reference kept in sync.
# Sourcing both would fire every bind twice.
# Absolute path: Hyprland's PATH does not include ~/.local/bin
$nuitBin = $HOME/.local/bin
bind = SUPER, RETURN, exec, ghostty
bind = SUPER SHIFT, RETURN, exec, firefox
bind = SUPER SHIFT, F, exec, nautilus
bind = SUPER, SPACE, exec, qs ipc call gsb toggleActivities

# Window management
bind = SUPER, W, killactive,
bind = SUPER, Q, killactive,
bind = SUPER, J, togglesplit,
bind = SUPER, P, pseudo,
bind = SUPER, T, togglefloating,
bind = SUPER, F, fullscreen, 0
bind = SUPER CTRL, F, fullscreen, 1
bind = SUPER ALT, F, fullscreen, 3

# Focus (SUPER+Left/Right = prev/next workspace; ALT+arrows = move focus)
# Clicking workspace numbers in the TopBar also switches.
bind = SUPER, LEFT, workspace, e-1
bind = SUPER, RIGHT, workspace, e+1
bind = SUPER, UP, movefocus, u
bind = SUPER, DOWN, movefocus, d
bind = ALT, LEFT, movefocus, l
bind = ALT, RIGHT, movefocus, r
bind = ALT, UP, movefocus, u
bind = ALT, DOWN, movefocus, d

# Workspace switching (SUPER + 1-0)
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move window to workspace
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Scroll through workspaces
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# Workspace switching with mouse side buttons (no modifier: back/forward)
bind = , mouse:275, workspace, e-1
bind = , mouse:276, workspace, e+1

# Move/resize windows with mouse
bind = SUPER, mouse:272, movewindow
bind = SUPER, mouse:273, resizewindow

# Swap windows
bind = SUPER SHIFT, LEFT, swapwindow, l
bind = SUPER SHIFT, RIGHT, swapwindow, r
bind = SUPER SHIFT, UP, swapwindow, u
bind = SUPER SHIFT, DOWN, swapwindow, d

# Next/previous window
bind = ALT, TAB, workspace, e+1
bind = ALT SHIFT, TAB, workspace, e-1

# Scratchpad
bind = SUPER, S, togglespecialworkspace, scratchpad
bind = SUPER SHIFT, S, movetoworkspacesilent, special:scratchpad

# Wallpaper
bind = SUPER SHIFT, SPACE, exec, nuit-theme-bg-next

# Screenshots (Print and Super+Ctrl+C = region picker)
bind = , PRINT, exec, sh -c 'g=$(slurp) || exit 0; grim -g "$g" - | wl-copy --type image/png'
bind = SHIFT, PRINT, exec, sh -c 'g=$(slurp) || exit 0; mkdir -p "$HOME/Pictures" && grim -g "$g" "$HOME/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png"'
bind = SUPER, PRINT, exec, hyprpicker -a -n
bind = ALT, PRINT, exec, $nuitBin/nuit-screenrecord region
bind = SUPER CTRL, C, exec, sh -c 'g=$(slurp) || exit 0; grim -g "$g" - | wl-copy --type image/png'

# Brightness keys (laptop panel)
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
