# Application bindings — LIVE keybind set, sourced by hyprland.conf.
# bindings.lua carries the same binds in Lua-plugin syntax as reference.
# Absolute path: Hyprland's PATH does not include ~/.local/bin
$nuitBin = $HOME/.local/bin
bind = SUPER, RETURN, exec, ghostty
bind = SUPER, B, exec, xdg-open https://
bind = SUPER SHIFT, B, exec, nuit-browser-private
bind = SUPER, F, exec, xdg-open $HOME
bind = SUPER SHIFT, F, fullscreen, 0
bind = SUPER, Q, killactive,
bind = SUPER, V, togglefloating,
bind = SUPER, SPACE, exec, qs ipc call gsb toggleActivities

# Window management (togglesplit lives on G: J is Vim focus-down)
bind = SUPER, P, pseudo,
bind = SUPER, G, togglesplit,

# QuickShell panels (IPC handler `gsb` defined in ~/.config/quickshell/shell.qml)
bind = SUPER, S, exec, qs ipc call gsb toggleQuickSettings
bind = SUPER, T, exec, qs ipc call gsb toggleCalendar
bind = SUPER SHIFT, S, exec, qs ipc call gsb toggleSettings
bind = SUPER, N, exec, qs ipc call gsb toggleNotifs
bind = SUPER, R, exec, qs ipc call gsb toggleReminders
bind = SUPER, W, exec, qs ipc call gsb toggleWifi
bind = SUPER CTRL, B, exec, qs ipc call gsb toggleBluetooth
bind = SUPER, C, exec, qs ipc call gsb toggleCaptureBoard
bind = SUPER, M, exec, qs ipc call gsb toggleYouTubeMusic
bind = SUPER SHIFT, N, exec, qs ipc call gsb toggleNightLight

# Focus (SUPER+arrows, ALT+arrows, and SUPER+HJK move focus;
# SUPER+L stays lock — a screen-lock key must never do anything else)
bind = SUPER, LEFT, movefocus, l
bind = SUPER, RIGHT, movefocus, r
bind = SUPER, UP, movefocus, u
bind = SUPER, DOWN, movefocus, d
bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = ALT, LEFT, movefocus, l
bind = ALT, RIGHT, movefocus, r
bind = ALT, UP, movefocus, u
bind = ALT, DOWN, movefocus, d

# Workspace switching (SUPER + 1-0)
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move window to workspace (SHIFT = move + follow, CTRL = send, stay put)
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10
bind = SUPER CTRL, 1, movetoworkspacesilent, 1
bind = SUPER CTRL, 2, movetoworkspacesilent, 2
bind = SUPER CTRL, 3, movetoworkspacesilent, 3
bind = SUPER CTRL, 4, movetoworkspacesilent, 4
bind = SUPER CTRL, 5, movetoworkspacesilent, 5
bind = SUPER CTRL, 6, movetoworkspacesilent, 6
bind = SUPER CTRL, 7, movetoworkspacesilent, 7
bind = SUPER CTRL, 8, movetoworkspacesilent, 8
bind = SUPER CTRL, 9, movetoworkspacesilent, 9
bind = SUPER CTRL, 0, movetoworkspacesilent, 10

# Scroll through workspaces
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# Workspace switching with mouse side buttons (no modifier: back/forward)
bind = , mouse:275, workspace, e-1
bind = , mouse:276, workspace, e+1

# Move/resize windows with mouse
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Swap windows
bind = SUPER SHIFT, LEFT, swapwindow, l
bind = SUPER SHIFT, RIGHT, swapwindow, r
bind = SUPER SHIFT, UP, swapwindow, u
bind = SUPER SHIFT, DOWN, swapwindow, d
bind = SUPER SHIFT, H, swapwindow, l
bind = SUPER SHIFT, J, swapwindow, d
bind = SUPER SHIFT, K, swapwindow, u
bind = SUPER SHIFT, L, swapwindow, r

# Resize with keys
bind = SUPER CTRL, LEFT, exec, hyprctl dispatch resizeactive -20 0
bind = SUPER CTRL, RIGHT, exec, hyprctl dispatch resizeactive 20 0
bind = SUPER CTRL, UP, exec, hyprctl dispatch resizeactive 0 -20
bind = SUPER CTRL, DOWN, exec, hyprctl dispatch resizeactive 0 20
bind = SUPER CTRL, H, exec, hyprctl dispatch resizeactive -20 0
bind = SUPER CTRL, J, exec, hyprctl dispatch resizeactive 0 20
bind = SUPER CTRL, K, exec, hyprctl dispatch resizeactive 0 -20
bind = SUPER CTRL, L, exec, hyprctl dispatch resizeactive 20 0

# Cycle windows (most-recent-first)
bind = ALT, TAB, cyclenext,
bind = ALT SHIFT, TAB, cyclenext, prev

# Wallpaper (SHIFT+SPACE = next, CTRL+SPACE = pick from preloaded)
bind = SUPER SHIFT, SPACE, exec, nuit-theme-bg-next
bind = SUPER CTRL, SPACE, exec, nuit-theme-bg-pick

# Screenshots (Print and Super+Ctrl+C = capture menu)
bind = , PRINT, exec, sh -c 'g=$(slurp) || exit 0; grim -g "$g" - | wl-copy --type image/png'
bind = SHIFT, PRINT, exec, sh -c 'g=$(slurp) || exit 0; mkdir -p "$HOME/Pictures" && grim -g "$g" "$HOME/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png"'
bind = SUPER, PRINT, exec, hyprpicker -a -n
bind = ALT, PRINT, exec, $nuitBin/nuit-screenrecord region
bind = SUPER CTRL, C, exec, nuit-capture-menu
bind = SUPER, F1, exec, qs ipc call gsb toggleKeybinds

# Session (power dialog lives inside QuickSettings)
bind = SUPER SHIFT, Q, exec, qs ipc call gsb toggleQuickSettings
bind = SUPER SHIFT, ESCAPE, exec, hyprctl dispatch exit
bind = SUPER, L, exec, hyprlock
bind = SUPER, F8, exec, hyprlock

# Fn keys — volume / mic / media (arrive as XF86 keysyms when Fn is held)
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Fn+F5 refresh → reload Hyprland config (XF86 where the laptop sends it,
# SUPER+F5 fallback for boards without media keys so plain F5 is never hijacked)
bind = , XF86Reload, exec, hyprctl reload
bind = , XF86Refresh, exec, hyprctl reload
bind = SUPER, F5, exec, hyprctl reload

# Fn+F7 idle → toggle auto dim/lock/suspend (XF86Tools where sent, else SUPER+F7)
bind = , XF86Tools, exec, nuit-idle-toggle
bind = SUPER, F7, exec, nuit-idle-toggle

# Fn+F8 lock (XF86ScreenSaver is the key laptops send; SUPER+F8 fallback above)
bind = , XF86ScreenSaver, exec, hyprlock

# Brightness keys — Fn+F11/F12 on most laptops (laptop panel)
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
