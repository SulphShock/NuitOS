# NuitOS Hyprland config
#
# NOTE: this file is the readable, editable copy used for reference.
# The copy that actually ships in the ISO lives at:
#   iso/airootfs/etc/skel/.config/hypr/hyprland.conf
# Keep the two in sync.

monitor = ,preferred, auto, 1

# ── Environment ────────────────────────────────────────────
env = XCURSOR_SIZE, 24
env = QT_QPA_PLATFORMTHEME, qt6ct

# ── Autostart ──────────────────────────────────────────────
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = hyprpaper
exec-once = hypridle
# QuickShell topbar — shipped in the ISO, autostarted on every session.
exec-once = qs -d
exec-once = sh -c "sleep 2 && command -v nuit-random-wallpaper >/dev/null 2>&1 && exec nuit-random-wallpaper"

# ── Input Configuration ────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# ── General Configuration ──────────────────────────────────
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
    allow_tearing = false
}

# ── Decoration ─────────────────────────────────────────────
decoration {
    rounding = 5

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

# ── Animations (Faster) ────────────────────────────────────
animations {
    enabled = true
    bezier = easeOutQuart, 0.25, 1, 0.5, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1

    animation = windows, 1, 3, easeOutQuart, slide
    animation = windowsOut, 1, 3, easeOutQuart, slide
    animation = fade, 1, 2, easeOutQuart
    animation = workspaces, 1, 2, easeOutQuart, slide
    animation = layers, 1, 2, easeOutQuart, fade
}

# ── Layouts ────────────────────────────────────────────────
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# ── Gestures ───────────────────────────────────────────────
gestures {
    workspace_swipe = true
}

# ── Keybindings ────────────────────────────────────────────
$mainMod = SUPER

bind = $mainMod, Return, exec, ghostty
bind = $mainMod, C, killactive
bind = $mainMod SHIFT, F, exec, thunar
bind = $mainMod SHIFT, B, exec, firefox
bind = $mainMod, V, togglefloating
bind = $mainMod, Space, exec, wofi --show drun
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ── QuickShell panels (IPC handler `gsb` defined in ~/.config/quickshell/shell.qml) ─
bind = $mainMod, S, exec, qs ipc call gsb toggleQuickSettings
bind = $mainMod, T, exec, qs ipc call gsb toggleCalendar
bind = $mainMod, A, exec, qs ipc call gsb toggleActivities
bind = $mainMod SHIFT, S, exec, qs ipc call gsb toggleSettings

# ── Screenshots (Print and Super+Ctrl+C = region picker) ─────
bind = , PRINT, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, PRINT, exec, sh -c 'mkdir -p "$HOME/Pictures" && grim -g "$(slurp)" "$HOME/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png"'
bind = $mainMod SHIFT, Space, exec, nuit-random-wallpaper

# ── Window Rules ───────────────────────────────────────────
windowrule = float, class:^(pavucontrol)$
windowrule = float, class:^(nm-applet)$
windowrule = float, class:^(blueman-manager)$