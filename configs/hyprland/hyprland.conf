# ── Monitor Configuration ───────────────────────────────────
monitor = , preferred, auto, 1

# ── Autostart ──────────────────────────────────────────────
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent
exec-once = hyprpaper
exec-once = qs -d
exec-once = sh -c "sleep 2 && \$HOME/.local/bin/nuit-random-wallpaper"

# ── Environment Variables ──────────────────────────────────
env = XCURSOR_SIZE, 24
env = QT_QPA_PLATFORMTHEME, qt6ct

# ── Input Configuration ────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

# ── General Configuration ──────────────────────────────────
general {
    gaps_in = 5
    gaps_out = 4
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
    allow_tearing = false
}

# ── Decoration ─────────────────────────────────────────────
decoration {
    rounding = 5

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

# ── Animations (Faster) ────────────────────────────────────
animations {
    enabled = true
    bezier = easeOutQuart, 0.25, 1, 0.5, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1

    animation = windows, 1, 3, easeOutQuart, slide
    animation = windowsOut, 1, 3, easeOutQuart, slide
    animation = fade, 1, 2, easeOutQuart
    animation = workspaces, 1, 2, easeOutQuart, slide
    animation = layers, 1, 2, easeOutQuart, fade
}

# ── Layouts ────────────────────────────────────────────────
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# ── Gestures ───────────────────────────────────────────────
gestures {
    workspace_swipe = true
}

# ── Keybindings ────────────────────────────────────────────
$mainMod = SUPER

bind = $mainMod, Return, exec, kitty
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit
bind = $mainMod, E, exec, thunar
bind = $mainMod, V, togglefloating
bind = $mainMod, R, exec, wofi --show drun
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ── Wallpaper ──────────────────────────────────────────────
# NOTE: $HOME expands via shell at exec time (Hyprland's PATH lacks ~/.local/bin,
# so bare nuit-* names would fail — always use the $HOME/.local/bin/ prefix)
bind = $mainMod SHIFT, Space, exec, \$HOME/.local/bin/nuit-random-wallpaper

# ── Screenshots (Print and Super+Ctrl+C = region picker) ─────
bind = , PRINT, exec, $HOME/.local/bin/nuit-screenshot region
bind = SHIFT, PRINT, exec, $HOME/.local/bin/nuit-screenshot region save
bind = SUPER, PRINT, exec, hyprpicker -a -n
bind = ALT, PRINT, exec, $HOME/.local/bin/nuit-screenrecord region
bind = SUPER CTRL, C, exec, $HOME/.local/bin/nuit-screenshot region

# ── Mouse workspace switching (side buttons, no modifier) ────
bind = , mouse:275, workspace, e-1
bind = , mouse:276, workspace, e+1

# ── Window Rules ───────────────────────────────────────────
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-applet)$
windowrulev2 = float, class:^(blueman-manager)$
