# Hyprland Autostart Configuration
# hyprpaper + hypridle are managed by systemd user services (enabled below),
# not exec-once — exec-once would double-launch them next login.
# Enable once: systemctl --user enable hyprpaper.service hypridle.service
exec-once = systemctl --user start hyprpaper.service hypridle.service
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
