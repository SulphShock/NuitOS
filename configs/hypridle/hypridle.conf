# Walk away and this takes over. stages below, timeouts in honest seconds.

# NuitOS idle stages (hypridle).
#
# TIMELINE: 5min idle → anim ON, 10min (5min later) → anim OFF + lock,
#   15min → screen off, 30min → suspend. Any input resets the timers.
#
# WHAT: hypridle watches for inactivity and runs a command at each stage.
#   Stage 1 fades in a subtle QuickShell dim overlay (anim ON), Stage 2 turns
#   the animation OFF and locks the session, then screen-off and suspend —
#   each step only fires if you have been idle that long.
#
# WHERE: this file is canonical at configs/hypridle/hypridle.conf.
#   The live ISO / installed copy lives at
#   ~/.config/hypr/hypridle.conf (from iso/airootfs/etc/skel/.config/hypr/).
#   Keep the two identical — the release script refuses to build on drift.
#   hypridle is started from hyprland.conf (`exec-once = hypridle`).
#
# CUSTOMIZE — the 5 knobs (all below, all plain numbers/commands):
#   1. idle timeout ... Stage 1 `timeout = 300` (seconds; 600 = 10 min).
#   2. anim cmd ....... Stage 1 `on-timeout` / `on-resume` run
#                       nuit-idle-animation (see configs/bin/nuit-idle-animation
#                       + configs/quickshell/widgets/IdleOverlay.qml).
#   3. lock ........... Stage 2 `timeout = 600` runs loginctl lock-session.
#   4. screen-off ..... Stage 3 `timeout = 900` runs hyprctl dispatch dpms off.
#   5. suspend ........ Stage 4 `timeout = 1800` runs systemctl suspend.
#
# HOW TO DISABLE a stage: comment out its whole `listener { ... }` block
#   (prefix every line with #) and reload hypridle. To disable idle handling
#   entirely, comment out the `exec-once = hypridle` line in hyprland.conf.
#
# HOW TO ADD a stage: copy any `listener` block, change `timeout` (seconds
#   of inactivity) and the command. Example — warn at 20 min:
#     listener {
#         timeout = 1200
#         on-timeout = notify-send -a Nuit "Idle" "20 minutes, suspending soon"
#     }
#   Listeners must stay in ascending timeout order.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# ── Stage 1: 5min idle → anim ON ──
# CHANGE ME: 300 = seconds of inactivity (600 = 10 min).
# Animation cmd = nuit-idle-animation (fades the QuickShell overlay in/out).
# Stays visible until Stage 2 (5min later) turns it OFF + locks.
# To disable, comment out this block.
listener {
    timeout = 300
    on-timeout = nuit-idle-animation on
    on-resume = nuit-idle-animation off
}

# ── Stage 2: 10min (5min later) → anim OFF + lock ──
# 5min after Stage 1: hide the overlay, then lock so the heavy-blur lock screen takes over.
# To change lock timeout, edit 600. To disable, comment this block.
listener {
    timeout = 600
    on-timeout = nuit-idle-animation off; loginctl lock-session
}

# ── Stage 3: 15 min → screen off (kept as existing behavior, shifted 360→900) ──
# To change screen-off timeout, edit 900. To disable, comment this block.
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# ── Stage 4: 30 min → suspend (kept, shifted 900→1800) ──
# To change suspend timeout, edit 1800. To disable, comment this block.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
