[General]
# NuitOS tuning of gruvbox-minimal-sddm (upstream MIT, scientiac/gruvbox-minimal-sddm
# pinned at a652384). Gruvbox-dark-hard coherent: bg #1D2021, base #282828,
# text #EBDBB2, accent blue #83A598.
#
# Background: one of the shipped NuitOS wallpapers (absolute path, present in
# the ISO at /usr/share/backgrounds/). The installer copies this whole theme
# dir to the installed system, so the path stays valid post-install.
background=/usr/share/backgrounds/pilot_mountains_sonntag.jpg
# Upstream QML reads "backgroundMode" (bgFillMode() in Main.qml); keep both keys
# so the fill mode actually applies instead of falling back to Image.Pad.
backgroundMode=aspect
backgroundFillMode=aspect
backgroundFill=#1D2021

# Default text color for all labels (gruvbox light)
basicTextColor=#EBDBB2

# Password input (gruvbox dark bar, light text)
passwordInputBackground=#CC282828
passwordInputRadius=4
passwordCharacter=●
passwordMask=true
passwordInputCursorVisible=false
passwordTextColor=#EBDBB2
passwordCursorColor=#83A598

# Typography — match the NuitOS shell (JetBrainsMono Nerd Font, shipped)
font=JetBrainsMono Nerd Font
passwordFontSize=32
usersFontSize=32
sessionsFontSize=24
showSessionsByDefault=false
showUsersByDefault=false

# Width of the password bar (fraction of screen width)
bar_width=0.2

# Radius of background blur (FastBlur needs qt6-5compat — in packages.x86_64)
blurRadius=15
