# General
general {
    gaps_in = 3
    gaps_out = 6
    border_size = 1
    col.active_border = rgba(83a598ff)
    col.inactive_border = rgba(504945ff)
    layout = dwindle
}

# Decoration
decoration {
    rounding = 4

    blur {
        # On for the app menu's blurred backdrop (layerrule below scopes it
        # to the menu layer; opaque windows don't pay for it).
        enabled = true
        size = 8
        passes = 2
    }

    shadow {
        enabled = false
    }
}

# Animations
animations {
    enabled = true
    bezier = snappy, 0.05, 0.9, 0.1, 1.0
    bezier = linear, 0, 0, 1, 1

    animation = windows, 1, 2, snappy, slide
    animation = windowsOut, 1, 2, linear, slide
    animation = fade, 1, 1, linear
    animation = workspaces, 1, 2, snappy, slide
    animation = layers, 1, 1, linear, fade
}

# Layouts
dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    enable_swallow = false
}

# Gestures
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

# Input
input {
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
    kb_layout = us
}
