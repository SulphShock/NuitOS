# The lock screen: bold, blurry, keeps curious eyes out.

# NuitOS hyprlock — bold gruvbox-hard (avatar + clock + pill input).
# Source: wiki.hypr.land/Hypr-Ecosystem/hyprlock. Two copies kept in sync:
#   - configs/hyprlock/hyprlock.conf                  (reference)
#   - iso/airootfs/etc/skel/.config/hypr/hyprlock.conf (ships in the ISO)
# Avatar ships at /usr/share/nuit/avatar.png (ISO + installer payload).

general {
    hide_cursor = false
    grace = 5
    fail_timeout = 2000
    immediate_render = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fade, 1, 1.8, linear
    animation = fadeIn, 1, 1.2, linear
}

background {
    monitor =
    path = screenshot
    # Privacy: heavy blur — content unreadable at a glance
    blur_passes = 5
    blur_size = 12
    brightness = 0.5
    contrast = 1.1
    vibrancy = 0.15
}

image {
    monitor =
    path = /usr/share/nuit/avatar.png
    size = 180
    rounding = -1
    border_size = 5
    border_color = rgb(83a598)
    halign = center
    valign = center
    position = 0, 140
}

label {
    monitor =
    text = $TIME
    color = rgb(fbf1c7)
    font_size = 132
    font_family = Liberation Serif
    halign = center
    valign = center
    position = 0, 20
}

label {
    monitor =
    text = cmd[update:60000, date +"%A %d %b"]
    color = rgba(235, 219, 178, 0.85)
    font_size = 24
    font_family = Liberation Serif
    halign = center
    valign = center
    position = 0, -70
}

label {
    monitor =
    text = $USER
    color = rgb(83a598)
    font_size = 20
    font_family = JetBrains Mono Nerd Font
    halign = center
    valign = center
    position = 0, -105
}

input-field {
    monitor =
    size = 340, 56
    rounding = 28
    dots_size = 0.3
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(fabd2f)
    inner_color = rgb(1d2021)
    font_color = rgb(fbf1c7)
    placeholder_text = <i>Password…</i>
    fade_on_empty = true
    fade_timeout = 200
    halign = center
    valign = center
    position = 0, -175
}
