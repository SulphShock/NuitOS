# NuitOS hyprlock — minimal gruvbox-hard (avatar + clock + pill input).
# Source: wiki.hypr.land/Hypr-Ecosystem/hyprlock. Two copies kept in sync:
#   - configs/hyprlock/hyprlock.conf                  (reference)
#   - iso/airootfs/etc/skel/.config/hypr/hyprlock.conf (ships in the ISO)
# Avatar ships at /usr/share/nuit/avatar.png (ISO + installer payload).

general {
    hide_cursor = false
    grace = 5
    fail_timeout = 2000
    immediate_render = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fade, 1, 1.8, linear
    animation = fadeIn, 1, 1.2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.8
    vibrancy = 0.2
}

image {
    monitor =
    path = /usr/share/nuit/avatar.png
    size = 140
    rounding = -1
    border_size = 3
    border_color = rgb(83a598)
    halign = center
    valign = center
    position = 0, 120
}

label {
    monitor =
    text = $TIME
    color = rgb(ebdBB2)
    font_size = 48
    font_family = JetBrains Mono Nerd Font
    halign = center
    valign = center
    position = 0, 0
}

label {
    monitor =
    text = $USER
    color = rgba(235, 219, 178, 0.7)
    font_size = 14
    font_family = JetBrains Mono Nerd Font
    halign = center
    valign = center
    position = 0, -24
}

input-field {
    monitor =
    size = 280, 44
    rounding = 22
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(83a598)
    inner_color = rgb(282828)
    font_color = rgb(ebdBB2)
    placeholder_text = <i>Password…</i>
    fade_on_empty = true
    fade_timeout = 200
    halign = center
    valign = center
    position = 0, -120
}
