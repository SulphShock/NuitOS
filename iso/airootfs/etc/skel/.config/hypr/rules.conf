# Window Rules - Float
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-applet)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(thunar)$, title:^(File Operation Progress)$
windowrulev2 = float, class:^(org.gnome.Calculator)$
windowrulev2 = float, class:^(org.gnome.Settings)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, title:^(Open File)$
windowrulev2 = float, title:^(Save File)$
windowrulev2 = float, title:^(Confirm)$

# Window Rules - Size
windowrulev2 = size 800 600, class:^(pavucontrol)$
windowrulev2 = size 800 600, class:^(blueman-manager)$

# Window Rules - Opacity
windowrulev2 = opacity 0.90 0.85, class:^(ghostty)$
windowrulev2 = opacity 0.90 0.85, class:^(code-oss)$
windowrulev2 = opacity 0.90 0.85, class:^(nautilus)$
windowrulev2 = opacity 0.90 0.85, class:^(firefox)$

# Window Rules - Workspace
windowrulev2 = workspace 1, class:^(ghostty)$
windowrulev2 = workspace 2, class:^(firefox)$
windowrulev2 = workspace 3, class:^(code-oss)$
windowrulev2 = workspace 4, class:^(nautilus)$

# Layer Rules
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, notifications
layerrule = ignorealpha 0.5, notifications
layerrule = blur, quickshell:nuit-menu
