; NuitOS Night Light (gammastep) — warm the screen after dark.
; WHERE: configs/gammastep/config.ini → ~/.config/gammastep/config.ini
; TOGGLE: Quick Settings → Night Light, or `qs ipc call gsb toggleNightLight` (add this IPC if missing — see 4).
; AUTO: set your lat/lon below for sunrise/sunset, or leave manual + use the toggle (one-shot 4500K, no location needed).
; TEMP: day 6500K, night 4500K (lower = warmer; 3500K is very warm). Edit temp-night to taste.
[general]
temp-day=6500
temp-night=4500
transition=1
brightness-day=1.0
brightness-night=0.9
gamma=0.9
adjustment-method=wayland
fade=1
[manual]
; Find yours: https://location.services.mozilla.com/v1/geolocate → or maps. Example Paris: lat=48.9 lon=2.4
lat=0.0
lon=0.0
