# NuitOS slick-greeter face — gruvbox-dark-hard.
# Section name is case-sensitive ([Greeter], capital G). See: slick-greeter(8).
[Greeter]
background=/usr/share/backgrounds/Cat_at_Play.webp
background-color=#1D2021
draw-user-backgrounds=false
show-hostname=false
show-clock=true
clock-format=%l:%M %p
theme-name=Adwaita-dark
icon-theme-name=Adwaita
font-name=JetBrains Mono Nerd Font 11
logo=/usr/share/nuit/avatar.png
enable-hidpi=auto
