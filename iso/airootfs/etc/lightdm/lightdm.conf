# NuitOS LightDM config — Mint-style slick greeter, Hyprland session.
# NOTE: no display manager runs on the live ISO (getty autologin + Hyprland
# exec instead), so there is deliberately NO autologin-user here. Installed
# systems get their own lightdm.conf (with gated autologin) from nuit-installer.
[Seat:*]
greeter-session=lightdm-slick-greeter
user-session=hyprland
logind-check-graphical=true
