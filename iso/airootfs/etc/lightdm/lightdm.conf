# NuitOS LightDM config — Mint-style slick greeter, Hyprland session.
[Seat:*]
greeter-session=lightdm-slick-greeter
user-session=hyprland
# Live ISO autologin (the installer writes autologin-user only on opt-in;
# installed systems ask for a password by default).
autologin-user=nuitos
autologin-user-timeout=0
autologin-session=hyprland
# Required on some hardware/firmware: without it LightDM can fail autologin
# and drop back to the greeter (ArchWiki: blank-screen/return-to-greeter fix).
logind-check-graphical=true
